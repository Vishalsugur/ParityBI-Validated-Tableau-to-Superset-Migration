    meta:
      width: 12
      height: 25
      code: '### What the documentation team can take from this

        1. **Every handoff costs time.** Solved without reassignment: median **0.7
        h**. Three or more handoffs: **192 h**. Better first-line knowledge articles
        target exactly this.

        2. **Where to write first:** the table ranks categories by incidents that
        were *not* solved at first contact.

        3. **Waiting for the user:** 30% of all open hours before resolution are spent
        in *Awaiting User Info* (22% of incidents, median 18 h per wait). Clearer
        how-to and intake guides target this wait.

        4. **The knowledge flag can''t measure article impact** in this data: it switches
        from ~98% to ~1% on 11 Mar 2016 (bottom chart). Fixing this tracking is a
        prerequisite for measuring documentation impact.'
